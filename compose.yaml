services:
  ollama:
    image: ollama/ollama:0.40.0
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ./models/ollama:/root/.ollama/models
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  api:
    build: .
    network_mode: service:ollama
    environment:
      HOST: 0.0.0.0
      API_KEYS: ${API_KEYS:?Set named random API keys for the published Docker profile}
      OLLAMA_URL: http://127.0.0.1:11434
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
      GENERATOR: ${GENERATOR:-qwen4b}
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
